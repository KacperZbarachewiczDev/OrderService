spring:
  application:
    name: order-audit-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_audit}
    username: ${DB_USER:order_audit}
    password: ${DB_PASSWORD:order_audit}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

audit:
  initial-lookback: P30D
  candidate-batch-size: 500
  lock-name: daily-audit
  lock-lease: PT2H

  schedule:
    cron: "0 0 2 * * *"
    zone: UTC
    outbox-delay: PT10S
    outbox-initial-delay: PT5S
    resync-recovery-delay: PT30S
    resync-recovery-initial-delay: PT30S

  kafka:
    order-topic: order-events
    payment-topic: payment-events
    group-id: order-audit-service
    concurrency: 3

  notification:
    recipients:
      - audit-alerts@example.com
    from: order-audit@example.com
    max-listed-issues: 25
    max-collected-digests: 100
    issues-url: http://localhost:8080/api/audit/issues

  resync:
    pool-size: 8
    queue-capacity: 1000
    stale-after: PT2M
    poll-limit: 50

  outbox:
    batch-size: 20
    max-attempts: 5
    initial-backoff: PT30S
    max-backoff: PT10M
    claim-lease: PT5M

sources:
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:9101}
    connect-timeout: PT2S
    read-timeout: PT10S
    max-attempts: 3
    retry-delay: PT0.2S
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:9102}
    connect-timeout: PT2S
    read-timeout: PT10S
    max-attempts: 3
    retry-delay: PT0.2S

logging:
  level:
    com.task.ing.orderaudit: INFO
